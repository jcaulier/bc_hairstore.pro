{{#if theme_settings.subscribe}}
<article class="footer-info-col" data-section-type="footer-social">
    <p class="footer-info-heading footer-info-heading--toggle f-bold f-size-small-mb o-h">
        <span class="d-inline-block halo-fadeInUp">RETROUVEZ NOUS SUR</span>
    </p>

    <div class="footer-info-list"> <!-- nécessaire pour les toggles mobiles -->

        <div class="footer-social-wrapper halo-fadeInUp" data-halo-animate="2">
            {{> components/common/social-links}}
        </div>

        <p class="link-line d-inline-block halo-fadeInUp" data-halo-animate="2">
            <span>Inscrivez vous à notre newsletter</span>
        </p>

        {{#if settings.show_newsletter_box}}
            <div class="newsletter-form" style="max-width: 400px; margin: 0 auto;">
                {{> components/common/subscription-form}}
            </div>
        {{/if}}

    </div>
</article>

{{/if}}
