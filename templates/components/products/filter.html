    <div class="actionBar-filter">
        <form class="actionBar d-none-tb" method="get" data-sort-by="product" data-show-products>
            <ul class="filter-dropdown actionBar-dropdown b-r-24">
                <li class="filter-item pos-relative">
                    <a class="filter-action d-block has-dropdown"
                        href="#"
                        data-dropdown="limit"
                        aria-controls="limit"
                        aria-expanded="false"
                    >
                        <span class="f-semibold d-none-xxl">{{lang 'categories.product_per_page'}}</span>
                        <span class="dropdown-label">{{theme_settings.categorypage_products_per_page}}</span>
                        <svg class="icon" aria-hidden="true"><use href="#icon-chevron-down" /></svg>
                    </a>
                    <ul id="limit" class="dropdown-menu b-r-24" data-dropdown-content aria-hidden="true" tabindex="-1">
                        <li class="dropdown-menu-item">
                            <a class="btn-show-products{{#if theme_settings.categorypage_products_per_page '==' '8'}} selected{{/if}} link-line" data-index="1" data-value="8" aria-label="8" href="?limit=8">
                                <span>8</span>
                            </a>
                        </li>
                        <li class="dropdown-menu-item">
                            <a class="btn-show-products{{#if theme_settings.categorypage_products_per_page '==' '12'}} selected{{/if}} link-line" data-index="2" data-value="12" aria-label="12" href="?limit=12">
                                <span>12</span>
                            </a>
                        </li> 
                        <li class="dropdown-menu-item">
                            <a class="btn-show-products{{#if theme_settings.categorypage_products_per_page '==' '16'}} selected{{/if}} link-line" data-index="3" data-value="16" aria-label="16" href="?limit=16">
                                <span>16</span>
                            </a>
                        </li>   
                        <li class="dropdown-menu-item">
                            <a class="btn-show-products{{#if theme_settings.categorypage_products_per_page '==' '20'}} selected{{/if}} link-line" data-index="4" data-value="20" aria-label="20" href="?limit=20">
                                <span>20</span>
                            </a>
                        </li>
                        <li class="dropdown-menu-item">
                            <a class="btn-show-products{{#if theme_settings.categorypage_products_per_page '==' '40'}} selected{{/if}} link-line" data-index="5" data-value="40" aria-label="40" href="?limit=40">
                                <span>40</span>
                            </a>
                        </li>
                        <li class="dropdown-menu-item">
                            <a class="btn-show-products{{#if theme_settings.categorypage_products_per_page '==' '100'}} selected{{/if}} link-line" data-index="6" data-value="100" aria-label="100" href="?limit=100">
                                <span>100</span>
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>
        </form>
        <form class="actionBar" method="get" data-sort-by="product">
            {{> components/category/sort-box sort=sort}}
        </form>
    </div>
</div>
