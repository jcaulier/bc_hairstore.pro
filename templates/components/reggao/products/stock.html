<div class="stock-status-wrapper">
    {{#if product.can_purchase}}
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 33.608 26.951" class="stock-icon stock-icon--in">
            <path d="M3116.972,762.71l12.7,13.659,17.87-22.641" transform="translate(-3115.508 -752.489)" fill="none" stroke="#32aa40" stroke-width="4"/>
        </svg>
        <span class="stock-text stock-in">En stock : <strong>Expédié sous 24h</strong></span>
    {{else}}
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" class="stock-icon stock-icon--out">
            <line x1="1" y1="1" x2="23" y2="23" stroke="#d93025" stroke-width="2"/>
            <line x1="23" y1="1" x2="1" y2="23" stroke="#d93025" stroke-width="2"/>
        </svg>
        <span class="stock-text stock-out">Rupture de stock</span>
    {{/if}}
</div>
